---
- name: "dnf | Install dnf-automatic package"
  block:
    - name: "dnf | Update dnf cache"
      ansible.builtin.dnf:
        update_cache: "yes"
    - name: "dnf | Install package with dnf"
      ansible.builtin.dnf:
        name: "dnf-automatic"
        state: "present"
- name: "dnf | Deploy automatic.conf"
  ansible.builtin.template:
    src: "dnf_automatic.j2"
    dest: "{{ hostvars[inventory_hostname]['dnf_conf_dest'] + '/' +
      'automatic.conf' }}"
    owner: "root"
    group: "root"
    mode: "0644"
